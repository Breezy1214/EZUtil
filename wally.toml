version = "0.1.2"
license = "MIT"
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
exclude = [
	"Packages",
	"dev.project.json",
	"moonwave.toml",
	"sourcemap.json",
	"rokit.toml",
	"selene.toml",
	"stylua.toml",
]

[dependencies]
Janitor = "howmanysmall/janitor@1.18.3"
Promise = "evaera/promise@4.0.0"
